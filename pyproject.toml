[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multitempmail"
version = "0.2.0"
description = "Unified SDK for temporary email providers (mail.tm, catchmail.io, tempmail.lol) — no API keys required"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["multitempmail", "temporary-email", "disposable-email", "email", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
]
dependencies = ["httpx>=0.26"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff", "black", "mypy"]

[project.scripts]
multitempmail = "multitempmail.cli:main"

[project.urls]
Homepage = "https://github.com/0xdzik/multitempmail"
Documentation = "https://github.com/0xdzik/multitempmail/blob/main/README.md"
Repository = "https://github.com/0xdzik/multitempmail"
Issues = "https://github.com/0xdzik/multitempmail/issues"

[tool.setuptools.packages.find]
include = ["multitempmail*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
