name: Dependency Check

on:
  schedule:
    # Every Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    name: Latest-deps test run
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install with unpinned dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install --upgrade httpx pytest pytest-cov ruff black mypy

      - name: Dependency sanity (pip check)
        run: pip check

      - name: Test suite against latest deps
        run: pytest -q

      - name: Report outdated packages
        run: pip list --outdated --format=columns || true
