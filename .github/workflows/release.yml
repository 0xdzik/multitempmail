name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Verify build (twine check)
        run: twine check dist/*

      - name: Smoke-test sdist and wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "from multitempmail import TempMailClient; print('import ok')"
          multitempmail --help >/dev/null
          echo "console scripts ok"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: the "release" environment allows an id-token to
    # be minted for PyPI. Alternatively, set a PYPI_API_TOKEN repository
    # secret and the fallback path below is used instead.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Detect a fallback API token without referencing secrets in an
      # `if` condition (GitHub does not allow secrets there).
      - name: Detect PyPI API token
        id: token
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          echo "has_token=$([ -n "$PYPI_API_TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI (API token)
        if: steps.token.outputs.has_token == 'yes'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to PyPI (trusted publishing)
        if: steps.token.outputs.has_token != 'yes'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      # Configure one of the two methods:
      # 1. Trusted publishing (recommended): enable "Trusted Publishing" for
      #    the multitempmail project at https://pypi.org/manage/project/
      #    (publisher: the repository owner, workflow name "Release").
      # 2. API token: create a token at https://pypi.org/manage/account/token/
      #    and store it as the PYPI_API_TOKEN repository secret.